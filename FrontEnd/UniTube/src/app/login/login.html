<div class="tela-login">

    <div class="original-card">

        <div class = "left-card">
            <h1> Teste </h1>
        </div>

        <div class="right-card">

            <h1> Bem-Vindo </h1>
            <div class="inputs">
                <form [formGroup]="loginForm" class ="centralizar">
                        <input type="text" formControlName="login" id="login" placeholder="Digite seu login">
                        <input type="password" formControlName="password" id="password" placeholder="Digite sua senha">
                </form>
            </div>
            <button (click)="enviarDados()" class="button">Enter</button>

        </div>
    </div>
</div>
